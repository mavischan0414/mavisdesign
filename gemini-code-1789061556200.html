<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Illustration Portfolio</title>
<style>
    :root {
        --bg-color: #FAFAFA;
        --text-main: #111111;
        --text-muted: #888888;
    }
    body { 
        font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; 
        margin: 0; 
        padding: 0; 
        background: var(--bg-color); 
        color: var(--text-main); 
    }
    /* Section Container */
    .section { 
        max-width: 1200px; 
        margin: 0 auto; 
        padding: 80px 40px; 
    }
    /* Typography */
    h1 { 
        font-size: 3.5em; 
        font-weight: 300; 
        letter-spacing: 2px; 
        margin-bottom: 10px; 
        text-transform: uppercase; 
    }
    h2 { 
        font-size: 1.2em; 
        font-weight: 400; 
        color: var(--text-muted); 
        margin-bottom: 50px; 
        letter-spacing: 1px; 
        text-transform: uppercase;
    }
    /* Tags / Expertise */
    .expertise { 
        display: flex; 
        gap: 15px; 
        flex-wrap: wrap; 
        margin-bottom: 60px; 
    }
    .tag { 
        border: 1px solid #ddd; 
        padding: 8px 20px; 
        border-radius: 30px; 
        font-size: 0.85em; 
        letter-spacing: 1px; 
        text-transform: uppercase;
    }
    /* Image Grid */
    .grid { 
        display: grid; 
        grid-template-columns: repeat(2, 1fr); 
        gap: 20px; 
        margin-bottom: 40px;
    }
    .grid.three-cols {
        grid-template-columns: repeat(3, 1fr);
    }
    .grid img { 
        width: 100%; 
        height: auto; 
        border-radius: 4px; 
        object-fit: cover;
        transition: opacity 0.3s ease;
    }
    .grid img:hover {
        opacity: 0.85;
    }
    /* Footer */
    .footer { 
        text-align: center; 
        padding: 100px 20px; 
        background: #111; 
        color: #fff; 
    }
    .footer h3 { 
        font-size: 2em; 
        font-weight: 300; 
        margin-bottom: 30px; 
        letter-spacing: 2px;
    }
    .guarantees { 
        display: flex; 
        justify-content: center; 
        gap: 30px; 
        margin-bottom: 50px; 
        font-weight: 300; 
        font-size: 0.9em;
        color: #ccc;
        flex-wrap: wrap;
    }
    .contact-btn { 
        display: inline-block; 
        padding: 16px 40px; 
        background: #fff; 
        color: #111; 
        text-decoration: none; 
        text-transform: uppercase; 
        letter-spacing: 2px; 
        font-weight: bold;
        border-radius: 2px;
    }
</style>
</head>
<body>

    <!-- Slide 1: Intro & Core Portfolio -->
    <div class="section">
        <h1>Portfolio</h1>
        <h2>Illustrator & Visual Designer</h2>
        
        <div class="expertise">
            <span class="tag">City & Travel Maps</span>
            <span class="tag">Packaging Design</span>
            <span class="tag">Children's Books</span>
            <span class="tag">Character Design</span>
        </div>

        <div class="grid">
            <img src="FlcwnvB8m7qOdVkJkyammwDYx2LC.jpg" alt="Children Illustration">
            <img src="FmJ-W3dxG-VoS3j4kQApgqVd1V9G_2950.jpg" alt="City Street Illustration">
            <img src="FtNTyXdNPsSe_RkVBNzLOr-0b_lR.jpg" alt="Animal Characters">
            <img src="Fph_a7lJnsePvMyErnnZUf2Zdxn_.jpg" alt="Forest Story">
        </div>
    </div>

    <!-- Slide 2: Secondary Grid (More Works) -->
    <div class="section" style="padding-top: 20px;">
        <div class="grid three-cols">
            <img src="FqjPjqxDabxBsGvkIyjaSNL-M_R9_4755.jpg" alt="Food Illustration">
            <img src="FvLFlZFe5bll45rt6CL325aSUCzj_4822.jpg" alt="Character Design">
            <img src="FjwSzapG1CZ_7-D0Quo-fUDlxBm3_0647.jpg" alt="Hotpot Design">
            <img src="Fi8UHlefX9YKzF-o4eqiLXgPT_bF.jpg" alt="Duck Character">
            <img src="FkHDEHt21NelAONQ-9pj1JCtQvaW.jpg" alt="Painter Illustration">
        </div>
    </div>

    <!-- Slide 3: Workflow & Contact -->
    <div class="footer">
        <h3>Let's Create Together</h3>
        <div class="guarantees">
            <span>Fast Turnaround</span>
            <span>•</span>
            <span>Consistent Quality</span>
            <span>•</span>
            <span>Commercial Use</span>
            <span>•</span>
            <span>Unlimited Revisions</span>
        </div>
        <a href="#" class="contact-btn">Contact Me</a>
    </div>

</body>
</html>
